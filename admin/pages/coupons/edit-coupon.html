<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopVista — Edit Coupon</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="../../assets/styles/all.min.css">
  <link rel="stylesheet" href="../../assets/styles/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../assets/styles/dashboard.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<div id="preloader" class="preloader">
  <div class="preloader-content">
    <div class="preloader-logo">SV</div>
    <div class="preloader-spinner"></div>
    <div class="preloader-text">Loading ShopVista...</div>
  </div>
</div>

<div class="dashboard-wrapper">

  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main Navigation"></aside>

  <div class="main-content">
  
    <header class="main-header" role="banner"></header>
    
    <main class="page-content edit-coupon-page" role="main">

      <div class="page-header">

        <div>
          <h1 class="page-title">Edit Coupon</h1>
          <p class="page-subtitle">Modify coupon details</p>
        </div>

        <div class="breadcrumb">
          <a href="../../index.html">Home</a>
          <span class="sep">/</span>
          <span>Edit Coupon</span>
        </div>

      </div>

      <div class="edit-coupon-card card">

        <h3 class="card-title">Edit Coupon</h3>

        <div class="form-group">
          <label class="form-label">Coupon Code</label>
          <input class="form-control-dash" value="SAVE20">
        </div>

        <div class="grid-2">

          <div class="form-group">
            <label class="form-label">Type</label>
            <select class="form-select-dash">
              <option selected>Percentage</option>
              <option>Fixed</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Value</label>
            <input class="form-control-dash" value="20">
          </div>

        </div>

        <div class="grid-2">

          <div class="form-group">
            <label class="form-label">Limit</label>
            <input class="form-control-dash" value="500">
          </div>

          <div class="form-group">
            <label class="form-label">Expires</label>
            <input class="form-control-dash" type="date" value="2026-04-30">
          </div>

        </div>

        <div class="action-buttons">
          <button class="btn-outline-dash">Cancel</button>
          <button class="btn-primary-dash"><i class="fas fa-save"></i> Update</button>
        </div>

      </div>

    </main>

  </div>

</div>

<script src="../aside.js"></script>
<script src="../header.js"></script>
<script src="../../assets/js/all.min.js"></script>
<script src="../../assets/js/dashboard.js"></script>
</body>
</html>
