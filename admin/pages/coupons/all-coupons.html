<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopVista — All Coupons</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="../../assets/styles/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../assets/styles/all.min.css">
  <link rel="stylesheet" href="../../assets/styles/dashboard.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<div id="preloader" class="preloader">
  <div class="preloader-content">
    <div class="preloader-logo">SV</div>
    <div class="preloader-spinner"></div>
    <div class="preloader-text">Loading ShopVista...</div>
  </div>
</div>

<div class="dashboard-wrapper">

  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main Navigation"></aside>

  <div class="main-content">

    <header class="main-header" role="banner"></header>

    <main class="page-content all-coupons-page" role="main">

      <div class="page-header">
        <div>
          <h1 class="page-title">All Coupons</h1>
          <p class="page-subtitle">Manage discount coupons</p>
        </div>
        <div class="breadcrumb">
          <a href="../../index.html">Home</a><span class="sep">/</span><span>All Coupons</span>
        </div>
      </div>

      <div class="search-block">
        <input class="form-control-dash search-input" placeholder="Search coupons...">
        <a href="create-coupon.html" class="btn-primary-dash"><i class="fas fa-plus"></i> Create Coupon</a>
      </div>

      <div class="table-card">
        <table class="data-table">
          <thead>
            <tr>
              <th>Code</th>
              <th>Discount</th>
              <th>Type</th>
              <th>Usage</th>
              <th>Expires</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="valid-code-field">SAVE20</td>
              <td>20%</td><td>Percentage</td>
              <td>145 / 500</td>
              <td>Apr 30, 2026</td>
              <td><span class="badge badge-success">Active</span></td>
              <td>
                <a href="edit-coupon.html" class="btn-icon"><i class="fas fa-pen"></i></a>
                <button class="btn-icon"><i class="fas fa-trash"></i></button>
              </td>
            </tr>
            <tr>
              <td class="valid-code-field">FLAT50</td>
              <td>$50</td><td>Fixed</td><td>89 / 200</td>
              <td>Mar 31, 2026</td>
              <td><span class="badge badge-success">Active</span></td>
              <td>
                <a href="edit-coupon.html" class="btn-icon"><i class="fas fa-pen"></i></a>
                <button class="btn-icon"><i class="fas fa-trash"></i></button>
              </td>
            </tr>
            <tr>
              <td class="expired-code-field">WELCOME10</td>
              <td>10%</td>
              <td>Percentage</td>
              <td>500 / 500</td>
              <td>Feb 28, 2026</td>
              <td><span class="badge badge-danger">Expired</span></td>
              <td>
                <a href="edit-coupon.html" class="btn-icon"><i class="fas fa-pen"></i></a>
                <button class="btn-icon"><i class="fas fa-trash"></i></button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </main>

  </div>

</div>

<script src="../aside.js"></script>
<script src="../header.js"></script>
<script src="../../assets/js/all.min.js"></script>
<script src="../../assets/js/dashboard.js"></script>
</body>
</html>
