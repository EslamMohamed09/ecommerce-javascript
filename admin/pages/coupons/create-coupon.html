<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopVista — Create Coupon</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="../../assets/styles/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../assets/styles/all.min.css">
  <link rel="stylesheet" href="../../assets/styles/dashboard.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<div id="preloader" class="preloader">
  <div class="preloader-content">
    <div class="preloader-logo">SV</div>
    <div class="preloader-spinner"></div>
    <div class="preloader-text">Loading ShopVista...</div>
  </div>

</div>

<div class="dashboard-wrapper">

  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main Navigation"></aside>

  <div class="main-content">

    <header class="main-header" role="banner"></header>

    <main class="page-content create-coupon-page" role="main">

      <div class="page-header">
        <div>
          <h1 class="page-title">Create Coupon</h1>
          <p class="page-subtitle">Add a new discount coupon</p>
        </div>
        <div class="breadcrumb">
          <a href="../../index.html">Home</a><span class="sep">/</span><span>Create Coupon</span>
        </div>
      </div>

      <div class="coupon-details-page card">

        <h3 class="card-title">Coupon Details</h3>
        
        <div class="form-group">
          <label class="form-label">Coupon Code</label>
          <input class="form-control-dash" placeholder="e.g. SAVE20">
        </div>

        <div class="grid-2">

          <div class="form-group">
            <label class="form-label">Discount Type</label>
            <select class="form-select-dash">
              <option>Percentage</option>
              <option>Fixed Amount</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Discount Value</label>
            <input class="form-control-dash" type="number" placeholder="20">
          </div>

        </div>

        <div class="grid-2">

          <div class="form-group">
            <label class="form-label">Usage Limit</label>
            <input class="form-control-dash" type="number" placeholder="500">
          </div>

          <div class="form-group">
            <label class="form-label">Expiry Date</label>
            <input class="form-control-dash" type="date">
          </div>

        </div>

        <div class="form-group">
          <label class="form-label">Min. Order Amount ($)</label>
          <input class="form-control-dash" type="number" placeholder="0">
        </div>

        <div class="action-buttons">
          <button class="btn-outline-dash">Cancel</button>
          <button class="btn-primary-dash"><i class="fas fa-check"></i> Create Coupon</button>
        </div>

      </div>

    </main>

  </div>

</div>

<script src="../aside.js"></script>
<script src="../header.js"></script>
<script src="../../assets/js/all.min.js"></script>
<script src="../../assets/js/dashboard.js"></script>
</body>
</html>
