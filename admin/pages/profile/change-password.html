<!DOCTYPE html>
  <html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>ShopVista — Change Password</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../../assets/styles/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../assets/styles/all.min.css">
  <link rel="stylesheet" href="../../assets/styles/dashboard.css">
</head>
<body>

<div id="preloader" class="preloader">
  <div class="preloader-content">
    <div class="preloader-logo">SV</div>
    <div class="preloader-spinner"></div>
    <div class="preloader-text">Loading ShopVista...</div>
  </div>
</div>
  
<div class="dashboard-wrapper">

  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main Navigation"></aside>
  
  <div class="main-content">
    
    <header class="main-header" role="banner"></header>
        
    <main class="page-content change-password-page" role="main">

      <div class="page-header">
        <div>
          <h1 class="page-title">Change Password</h1>
          <p class="page-subtitle">Update your password</p>
        </div>
        <div class="breadcrumb">
          <a href="../../index.html">Home</a>
          <span class="sep">/</span>
          <span>Change Password</span>
        </div>
      </div>

      <div class="change-password-card card">

        <h3 class="card-title">Change Password</h3>

        <div class="form-group">
          <label class="form-label">Current Password</label>
          <input class="form-control-dash" type="password" placeholder="Enter current password">
        </div>

        <div class="form-group">
          <label class="form-label">New Password</label>
          <input class="form-control-dash" type="password" placeholder="Enter new password">
        </div>

        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <input class="form-control-dash" type="password" placeholder="Confirm new password">
        </div>

        <div class="action-buttons">
          <button class="btn-outline-dash">Cancel</button>
          <button class="btn-primary-dash"><i class="fas fa-check"></i> Update Password</button>
        </div>

      </div>

    </main>

  </div>
  
</div>

<script src="../aside.js"></script>
<script src="../header.js"></script>
<script src="../../assets/js/all.min.js"></script>
<script src="../../assets/js/dashboard.js"></script>
</body>
</html>
