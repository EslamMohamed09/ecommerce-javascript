<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>ShopVista — Edit Profile</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../../assets/styles/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../assets/styles/all.min.css">
  <link rel="stylesheet" href="../../assets/styles/dashboard.css">
</head>
<body>

<div id="preloader" class="preloader">
  <div class="preloader-content">
    <div class="preloader-logo">SV</div>
    <div class="preloader-spinner"></div>
    <div class="preloader-text">Loading ShopVista...</div>
  </div>
</div>

<div class="dashboard-wrapper">

  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main Navigation"></aside>
      
  <div class="main-content">
    
    <header class="main-header" role="banner"></header>
    
    <main class="page-content edit-profile-page" role="main">

      <div class="page-header">

        <div>
          <h1 class="page-title">Edit Profile</h1>
          <p class="page-subtitle">Update your personal information</p>
        </div>

        <div class="breadcrumb">
          <a href="../../index.html">Home</a>
          <span class="sep">/</span><span>Edit Profile</span>
        </div>

      </div>

      <div class="edit-profile-card card">

        <h3 class="card-title">Edit Profile</h3>

        <div class="avatar-holder">
          <div class="avatar avatar-lg">JD</div>
          <button class="btn-outline-dash"><i class="fas fa-camera"></i> Change Photo</button>
        </div>

        <div class="grid-2">

          <div class="form-group">
            <label class="form-label">First Name</label>
            <input class="form-control-dash" value="John">
          </div>

          <div class="form-group">
            <label class="form-label">Last Name</label>
            <input class="form-control-dash" value="Doe">
          </div>

        </div>
          
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-control-dash" value="john.doe@shopvista.com">
        </div>

        <div class="form-group">
          <label class="form-label">Phone</label>
          <input class="form-control-dash" value="+20 123 456 789">
        </div>
        
        <div class="form-group">
          <label class="form-label">Bio</label>
          <textarea class="form-control-dash">Full-stack developer and e-commerce specialist.</textarea>
        </div>
        
        <div class="action-buttons">
          <button class="btn-outline-dash">Cancel</button>
          <button class="btn-primary-dash"><i class="fas fa-save"></i> Save</button>
        </div>
      
      </div>

    </main>

  </div>

</div>

<script src="../aside.js"></script>
<script src="../header.js"></script>
<script src="../../assets/js/all.min.js"></script>
<script src="../../assets/js/dashboard.js"></script>
</body>
</html>
