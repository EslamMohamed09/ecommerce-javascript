<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopVista — All Categories</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="../../assets/styles/all.min.css">
  <link rel="stylesheet" href="../../assets/styles/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../../assets/styles/dashboard.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<div id="preloader" class="preloader">
  <div class="preloader-content">
    <div class="preloader-logo">SV</div>
    <div class="preloader-spinner"></div>
    <div class="preloader-text">Loading ShopVista...</div>
  </div>
</div>

<div class="dashboard-wrapper">

  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main Navigation"></aside>

  <div class="all-categories-page main-content">

    <header class="main-header" role="banner"></header>

    <main class="page-content" role="main">

      <div class="page-header">
        <div>
          <h1 class="page-title">All Categories</h1>
          <p class="page-subtitle">Manage product categories</p>
        </div>
        <div class="breadcrumb">
          <a href="../../index.html">Home</a>
          <span class="sep">/</span>
          <span>All Categories</span>
        </div>
      </div>

      <div class="search-block">
        <input class="form-control-dash" placeholder="Search categories..." style="width:260px">
        <a href="add-category.html" class="btn-primary-dash"><i class="fas fa-plus"></i> Add Category</a>
      </div>

      <div class="categories-container grid-4">

        <div class="category-card card" style="text-align:center">
          <div class="image-holder"><i class="fas fa-laptop"></i></div>
          <h3 class="card-title">Electronics</h3>
          <p>248 products</p>
          <div class="action-btns">
            <a href="edit-category.html" class="btn-icon"><i class="fas fa-pen"></i></a>
            <button class="btn-icon"><i class="fas fa-trash"></i></button>
          </div>
        </div>

        <div class="category-card card">
          <div class="image-holder"><i class="fas fa-tshirt"></i></div>
          <h3 class="card-title">Fashion</h3>
          <p>186 products</p>
          <div class="action-btns">
            <a href="edit-category.html" class="btn-icon"><i class="fas fa-pen"></i></a>
            <button class="btn-icon"><i class="fas fa-trash"></i></button>
          </div>
        </div>

        <div class="category-card card">
          <div class="image-holder"><i class="fas fa-home"></i></div>
          <h3 class="card-title">Home & Garden</h3>
          <p>124 products</p>
          <div class="action-btns">
            <a href="edit-category.html" class="btn-icon"><i class="fas fa-pen"></i></a>
            <button class="btn-icon"><i class="fas fa-trash"></i></button>
          </div>
        </div>

        <div class="category-card card">
          <div class="image-holder"><i class="fas fa-book"></i></div>
          <h3 class="card-title">Books</h3>
          <p>95 products</p>
          <div class="action-btns">
            <a href="edit-category.html" class="btn-icon"><i class="fas fa-pen"></i></a>
            <button class="btn-icon"><i class="fas fa-trash"></i></button>
          </div>
        </div>

        <div class="category-card card">
          <div class="image-holder"><i class="fas fa-gamepad"></i></div>
          <h3 class="card-title">Toys & Games</h3>
          <p>76 products</p>
          <div class="action-btns">
            <a href="edit-category.html" class="btn-icon"><i class="fas fa-pen"></i></a>
            <button class="btn-icon"><i class="fas fa-trash"></i></button>
          </div>
        </div>

        <div class="category-card card">
          <div class="image-holder"><i class="fas fa-running"></i></div>
          <h3 class="card-title">Sports</h3>
          <p>62 products</p>
          <div class="action-btns">
            <a href="edit-category.html" class="btn-icon"><i class="fas fa-pen"></i></a>
            <button class="btn-icon"><i class="fas fa-trash"></i></button>
          </div>
        </div>

        <div class="category-card card">
          <div class="image-holder"><i class="fas fa-spa"></i></div>
          <h3 class="card-title">Beauty</h3>
          <p>143 products</p>
          <div class="action-btns">
            <a href="edit-category.html" class="btn-icon"><i class="fas fa-pen"></i></a>
            <button class="btn-icon"><i class="fas fa-trash"></i></button>
          </div>
        </div>

        <div class="category-card card">
          <div class="image-holder">
            <i class="fas fa-couch"></i>
          </div>
          <h3 class="card-title">Furniture</h3>
          <p>89 products</p>
          <div class="action-btns">
            <a href="edit-category.html" class="btn-icon"><i class="fas fa-pen"></i></a>
            <button class="btn-icon"><i class="fas fa-trash"></i></button>
          </div>
        </div>

      </div>

    </main>

  </div>

</div>

<script src="../aside.js"></script>
<script src="../header.js"></script>
<script src="../../assets/js/all.min.js"></script>
<script src="../../assets/js/dashboard.js"></script>
</body>
</html>
