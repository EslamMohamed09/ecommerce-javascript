<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>ShopVista — Upload Media</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="../../assets/styles/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../../assets/styles/all.min.css">
  <link rel="stylesheet" href="../../assets/styles/dashboard.css">
</head>
<body>

<div id="preloader" class="preloader">
  <div class="preloader-content">
    <div class="preloader-logo">SV</div>
    <div class="preloader-spinner"></div>
    <div class="preloader-text">Loading ShopVista...</div>
  </div>
</div>
  
<div class="dashboard-wrapper">

  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main Navigation"></aside>
      
  <div class="upload-media-page main-content">

    <header class="main-header" role="banner"></header>
      
    <main class="page-content" role="main">

      <div class="page-header">
        <div>
          <h1 class="page-title">Upload Media</h1>
          <p class="page-subtitle">Upload new media files</p>
        </div>
        <div class="breadcrumb">
          <a href="../../index.html">Home</a>
          <span class="sep">/</span>
          <span>Upload Media</span>
        </div>
      </div>

      <div class="upload-file-card card">
        <h3 class="card-title">Upload Files</h3>
        <div class="uploading-holder">
          <i class="fas fa-cloud-upload-alt"></i>
          <h4 class="semi-card-title">Drag & Drop Files Here</h4>
          <p class="card-description">or click to browse from your computer</p>
          <button class="btn-primary-dash"><i class="bi bi-folder2-open"></i> Browse Files</button>
          <p class="image-formats">Supported formats: JPG, PNG, GIF, SVG, MP4, PDF • Max size: 10MB</p>
        </div>
      </div>

    </main>

  </div>

</div>

<script src="../aside.js"></script>
<script src="../header.js"></script>
<script src="../../assets/js/all.min.js"></script>
<script src="../../assets/js/dashboard.js"></script>
</body>
</html>
