<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>ShopVista — Media Library</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="../../assets/styles/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../../assets/styles/all.min.css">
  <link rel="stylesheet" href="../../assets/styles/dashboard.css">
</head>
<body>

<div id="preloader" class="preloader">
  <div class="preloader-content">
    <div class="preloader-logo">SV</div>
    <div class="preloader-spinner"></div>
    <div class="preloader-text">Loading ShopVista...</div>
  </div>
</div>

<div class="dashboard-wrapper">
    
  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main Navigation"></aside>

  <div class="media-library-page main-content">

    <header class="main-header" role="banner"></header>

    <main class="page-content" role="main">

      <div class="page-header">
        <div>
          <h1 class="page-title">Media Library</h1>
          <p class="page-subtitle">Manage your media files</p>
        </div>
        <div class="breadcrumb">
          <a href="../../index.html">Home</a>
          <span class="sep">/</span>
          <span>Media Library</span>
        </div>
      </div>

      <div class="search-block">

        <div class="filter-bar">
          <input class="form-control-dash search-input" placeholder="Search files...">
          <select class="form-select-dash">
            <option>All Types</option>
            <option>Images</option>
            <option>Videos</option>
            <option>Documents</option>
          </select>
        </div>

        <a href="upload-media.html" class="btn-primary-dash"><i class="fas fa-cloud-upload-alt"></i>Upload</a>

      </div>

      <div class="cards-container grid-4">

        <div class="card">
          <div class="image-holder">
            <i class="fas fa-image"></i>
          </div>
          <div class="info-holder">
            <div class="semi-card-title">Product Photo 1</div>
            <div class="size-no">1.2 MB</div>
          </div>
        </div>

        <div class="card">
          <div class="image-holder">
            <i class="fas fa-image"></i>
          </div>
          <div class="info-holder">
            <div class="semi-card-title">Product Photo 2</div>
            <div class="size-no">856 KB</div>
          </div>
        </div>

        <div class="card">
          <div class="image-holder">
            <i class="fas fa-image"></i>
          </div>
          <div class="info-holder">
            <div class="semi-card-title">Banner Image</div>
            <div class="size-no">2.4 MB</div>
          </div>
        </div>

        <div class="card">
          <div class="image-holder">
            <i class="fas fa-image"></i>
          </div>
          <div class="info-holder">
            <div class="semi-card-title">Category Icon</div>
            <div class="size-no">124 KB</div>
          </div>
        </div>

        <div class="card">
          <div class="image-holder">
            <i class="fas fa-image"></i>
          </div>
          <div class="info-holder">
            <div class="semi-card-title">Logo</div>
            <div class="size-no">45 KB</div>
          </div>
        </div>

        <div class="card">
          <div class="image-holder">
            <i class="fas fa-image"></i>
          </div>
          <div class="info-holder">
            <div class="semi-card-title">Product Photo 3</div>
            <div class="size-no">1.8 MB</div>
          </div>
        </div>

        <div class="card">
          <div class="image-holder">
            <i class="fas fa-image"></i>
          </div>
          <div class="info-holder">
            <div class="semi-card-title">Background</div>
            <div class="size-no">3.1 MB</div>
          </div>
        </div>

        <div class="card">
          <div class="image-holder">
            <i class="fas fa-image"></i>
          </div>
          <div class="info-holder">
            <div class="semi-card-title">Promo Banner</div>
            <div class="size-no">956 KB</div>
          </div>
        </div>

      </div>

    </main>
  
  </div>

</div>

<script src="../aside.js"></script>
<script src="../header.js"></script>
<script src="../../assets/js/all.min.js"></script>
<script src="../../assets/js/dashboard.js"></script>
</body>
</html>
