<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>ShopVista — Payment Settings</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="../../assets/styles/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../../assets/styles/all.min.css">
  <link rel="stylesheet" href="../../assets/styles/dashboard.css">
</head>
<body>

<div id="preloader" class="preloader">
  <div class="preloader-content">
    <div class="preloader-logo">SV</div>
    <div class="preloader-spinner"></div>
    <div class="preloader-text">Loading ShopVista...</div>
  </div>
</div>
  
<div class="dashboard-wrapper">

  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main Navigation"></aside>
    
  <div class="main-content">

    <header class="main-header" role="banner">

      <div class="header-left-block">
        <button class="sidebar-toggle" aria-label="Toggle Sidebar"><i class="bi bi-chevron-right"></i></button>
        <div class="header-search-bar">
          <i class="fas fa-search"></i>
          <input type="search" placeholder="Search..." aria-label="Search">
        </div>
      </div>

      <div class="header-right-block">
        <button class="header-action-btn" id="theme-toggle" aria-label="Toggle Theme"><i class="fas fa-sun"></i></button>
        <button class="header-action-btn" aria-label="Notifications"><i class="fas fa-bell"></i><span class="dot"></span></button>
        <div class="topbar-divider"></div>
        <div class="header-user-holder">
          <div class="header-user-avatar">JD</div>
          <div>
            <div class="header-user-name">John Doe</div>
            <div class="header-user-role">Admin</div>
          </div>
        </div>
      </div>

    </header>
      
    <main class="page-content payment-settings-page" role="main">

      <div class="page-header">
        <div>
          <h1 class="page-title">Payment Settings</h1>
          <p class="page-subtitle">Manage payment gateways</p>
        </div>
        <div class="breadcrumb">
          <a href="../../index.html">Home</a>
          <span class="sep">/</span>
          <span>Payment Settings</span>
        </div>
      </div>

      <div class="payment-gateways-card card">

        <h3 class="card-title">Payment Gateways</h3>

        <div class="method-item">

          <div class="icon-holder">
            <i class="fab fa-stripe-s"></i>
          </div>

          <div class="method-title-holder">
            <div class="method-title">Stripe</div>
            <div class="mode">Active</div>
          </div>

          <label class="opened-toggle-switch-label"> <!-- open toggle switch button -->
            <input type="checkbox" class="toggle-checkbox" checked/>
            <div class="toggle-switch"> 
              <i class="fa-solid fa-xmark"></i>
              <i class="fa-solid fa-check"></i>
            </div>
          </label>

        </div>
        
        <div class="method-item">

          <div class="icon-holder">
            <i class="fab fa-paypal"></i>
          </div>
          
          <div class="method-title-holder">
            <div class="method-title">PayPal</div>
            <div class="mode">Active</div>
          </div>
        
          <label class="opened-toggle-switch-label"> <!-- open toggle switch button -->
            <input type="checkbox" class="toggle-checkbox" checked/>
            <div class="toggle-switch"> 
              <i class="fa-solid fa-xmark"></i>
              <i class="fa-solid fa-check"></i>
            </div>
          </label>
        
        </div>
        
        <div class="method-item">

          <div class="icon-holder">
            <!-- <i class="fab fa-money-bill"></i> -->
            <i class="fas fa-money-bill"></i>
          </div>
          
          <div class="method-title-holder">
            <div class="method-title">Cash on Delivery</div>
            <div class="mode">Inactive</div>
          </div>
          
          <label class="closed-toggle-switch-label"> <!-- closed toggle switch button -->
            <input type="checkbox" class="toggle-checkbox" checked/>
            <div class="toggle-switch"> 
              <i class="fa-solid fa-xmark"></i>
              <i class="fa-solid fa-check"></i>
            </div>
          </label>
        
        </div>
      
      </div>
    
    </main>

  </div>

</div>

<script src="../aside.js"></script>
<script src="../header.js"></script>
<script src="../../assets/js/all.min.js"></script>
<script src="../../assets/js/dashboard.js"></script>
</body>
</html>
