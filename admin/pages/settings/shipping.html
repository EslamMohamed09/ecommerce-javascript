<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>ShopVista — Shipping Settings</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="../../assets/styles/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../../assets/styles/all.min.css">
  <link rel="stylesheet" href="../../assets/styles/dashboard.css">
</head>
<body>

<div id="preloader" class="preloader">
  <div class="preloader-content">
    <div class="preloader-logo">SV</div>
    <div class="preloader-spinner"></div>
    <div class="preloader-text">Loading ShopVista...</div>
  </div>
</div>
  
<div class="dashboard-wrapper">

  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main Navigation"></aside>
  
  <div class="main-content">
    
    <header class="main-header" role="banner"></header>
    
    <main class="page-content shipping-settings-page" role="main">

      <div class="page-header">
        <div>
          <h1 class="page-title">Shipping Settings</h1>
          <p class="page-subtitle">Configure shipping zones</p>
        </div>
        <div class="breadcrumb">
          <a href="../../index.html">Home</a>
          <span class="sep">/</span>
          <span>Shipping Settings</span>
        </div>
      </div>
      
      <div class="shipping-settings-card card">

        <h3 class="card-title">Shipping</h3>

        <div class="form-group">
          <label class="form-label">Default Shipping</label>
          <select class="form-select-dash">
            <option>Free Shipping</option>
            <option>Flat Rate</option>
            <option>By Weight</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Flat Rate ($)</label>
          <input class="form-control-dash" type="number" value="5.00">
        </div>

        <div class="form-group">
          <label class="form-label">Free Shipping Min. ($)</label>
          <input class="form-control-dash" type="number" value="50.00">
        </div>

        <div class="mode-item internal-shipping-mode-item">
          <span class="mode-title">Enable International Shipping</span>
          <label class="opened-toggle-switch-label"> <!-- open toggle switch button -->
            <input type="checkbox" class="toggle-checkbox" checked/>
            <div class="toggle-switch"> 
              <i class="fa-solid fa-xmark"></i>
              <i class="fa-solid fa-check"></i>
            </div>
          </label>
        </div>

        <div class="mode-item real-time-rates-mode-item">
          <span class="mode-title">Enable Real-time Rates</span>
          <label class="closed-toggle-switch-label"> <!-- closed toggle switch button -->
            <input type="checkbox" class="toggle-checkbox" checked/>
            <div class="toggle-switch"> 
              <i class="fa-solid fa-xmark"></i>
              <i class="fa-solid fa-check"></i>
            </div>
          </label>
        </div>

        <div class="action-buttons">
          <button class="btn-outline-dash">Reset</button>
          <button class="btn-primary-dash"><i class="fas fa-save"></i> Save Changes</button>
        </div>

      </div>

    </main>

  </div>

</div>

<script src="../aside.js"></script>
<script src="../header.js"></script>
<script src="../../assets/js/all.min.js"></script>
<script src="../../assets/js/dashboard.js"></script>
</body>
</html>
