<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>ShopVista — General Settings</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="../../assets/styles/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../../assets/styles/all.min.css">
  <link rel="stylesheet" href="../../assets/styles/dashboard.css">
</head>
<body>

<div id="preloader" class="preloader">
  <div class="preloader-content">
    <div class="preloader-logo">SV</div>
    <div class="preloader-spinner"></div>
    <div class="preloader-text">Loading ShopVista...</div>
  </div>
</div>
  
<div class="dashboard-wrapper">
  
  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main Navigation"></aside>

  <div class="main-content">
  
    <header class="main-header" role="banner"></header>
  
    <main class="page-content general-settings-page" role="main">

      <div class="page-header">
        <div>
          <h1 class="page-title">General Settings</h1>
          <p class="page-subtitle">Configure general settings</p>
        </div>
        <div class="breadcrumb">
          <a href="../../index.html">Home</a>
          <span class="sep">/</span>
          <span>General Settings</span>
        </div>
      </div>
      
      <div class="general-card card">

        <h3 class="card-title">General</h3>

        <div class="form-group">
          <label class="form-label">Site Name</label>
          <input class="form-control-dash" type="text" value="ShopVista">
        </div>

        <div class="form-group">
          <label class="form-label">Site URL</label>
          <input class="form-control-dash" type="url" value="https://shopvista.com">
        </div>

        <div class="form-group">
          <label class="form-label">Admin Email</label>
          <input class="form-control-dash" type="email" value="admin@shopvista.com">
        </div>

        <div class="form-group">
          <label class="form-label">Timezone</label>
          <select class="form-select-dash">
            <option>UTC</option>
            <option>GMT+2</option>
            <option>GMT+3</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Language</label>
          <select class="form-select-dash">
            <option>English</option>
            <option>Arabic</option>
            <option>French</option>
          </select>
        </div>

        <div class="action-buttons">
          <button class="btn-outline-dash">Reset</button>
          <button class="btn-primary-dash"><i class="fas fa-save"></i> Save Changes</button>
        </div>

      </div>

    </main>

  </div>

</div>

<script src="../aside.js"></script>
<script src="../header.js"></script>
<script src="../../assets/js/all.min.js"></script>
<script src="../../assets/js/dashboard.js"></script>
</body>
</html>
