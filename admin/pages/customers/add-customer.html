<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopVista — Add Customer</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="../../assets/styles/all.min.css">
  <link rel="stylesheet" href="../../assets/styles/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../../assets/styles/dashboard.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<div id="preloader" class="preloader">
  <div class="preloader-content">
    <div class="preloader-logo">SV</div>
    <div class="preloader-spinner"></div>
    <div class="preloader-text">Loading ShopVista...</div>
  </div>
</div>

<div class="dashboard-wrapper">

  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main Navigation"></aside>

  <div class="main-content">

    <header class="main-header" role="banner">

      <div class="header-left-block">

        <button class="sidebar-toggle" aria-label="Toggle Sidebar"><i class="bi bi-chevron-right"></i></button>

        <div class="header-search-bar">
          <i class="fas fa-search"></i>
          <input type="text" placeholder="Search..." aria-label="Search">
        </div>
        
      </div>

      <div class="header-right-block">
        <button class="header-action-btn" id="theme-toggle" aria-label="Toggle Theme"><i class="fas fa-sun"></i></button>
        <button class="header-action-btn" aria-label="Notifications"><i class="fas fa-bell"></i><span class="dot"></span></button>
        <div class="topbar-divider"></div>
        <div class="header-user-holder">
          <div class="header-user-avatar">JD</div>
          <div>
            <div class="header-user-name">John Doe</div>
            <div class="header-user-role">Admin</div>
          </div>
        </div>
      </div>

    </header>

    <main class="page-content add-customer-page" role="main">

      <div class="page-header">

        <div>
          <h1 class="page-title">Add Customer</h1>
          <p class="page-subtitle">Create a new customer profile</p>
        </div>

        <div class="breadcrumb">
          <a href="../../index.html">Home</a>
          <span class="sep">/</span>
          <span>Add Customer</span>
        </div>
        
      </div>

      <div class="customer-information-card card">

        <h3 class="card-title">Customer Information</h3>

        <div class="grid-2">

          <div class="form-group">
            <label class="form-label">First Name</label>
            <input class="form-control-dash" placeholder="First name">
          </div>

          <div class="form-group">
            <label class="form-label">Last Name</label>
            <input class="form-control-dash" placeholder="Last name">
          </div>

        </div>

        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-control-dash" type="email" placeholder="customer@email.com">
        </div>

        <div class="form-group">
          <label class="form-label">Phone</label>
          <input class="form-control-dash" placeholder="+20 xxx xxx xxx">
        </div>

        <div class="form-group">
          <label class="form-label">Address</label>
          <textarea class="form-control-dash" placeholder="Full address"></textarea>
        </div>
        
        <div class="action-buttons">
          <button class="btn-outline-dash">Cancel</button>
          <button class="btn-primary-dash"><i class="fas fa-check"></i>Save Customer</button>
        </div>

      </div>

    </main>

  </div>

</div>

<script src="../aside.js"></script>
<script src="../header.js"></script>
<script src="../../assets/js/all.min.js"></script>
<script src="../../assets/js/dashboard.js"></script>
</body>
</html>
