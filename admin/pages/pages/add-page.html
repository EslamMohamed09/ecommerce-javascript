<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>ShopVista — Add Page</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="../../assets/styles/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../../assets/styles/all.min.css">
  <link rel="stylesheet" href="../../assets/styles/dashboard.css">
</head>
<body>

<div id="preloader" class="preloader">
  <div class="preloader-content">
    <div class="preloader-logo">SV</div>
    <div class="preloader-spinner"></div>
    <div class="preloader-text">Loading ShopVista...</div>
  </div>
</div>
  
<div class="dashboard-wrapper">
  
  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main Navigation"></aside>

  <div class="main-content">
    
    <header class="main-header" role="banner"></header>
    
    <main class="page-content add-page-page" role="main">

      <div class="page-header">
        <div>
          <h1 class="page-title">Add Page</h1>
          <p class="page-subtitle">Create a new CMS page</p>
        </div>
        <div class="breadcrumb">
          <a href="../../index.html">Home</a>
          <span class="sep">/</span>
          <span>Add Page</span>
        </div>
      </div>

      <div class="page-details-card card">

        <h3 class="card-title">Page Details</h3>

        <div class="form-group">
          <label class="form-label">Page Title</label>
          <input class="form-control-dash" placeholder="Enter page title">
        </div>

        <div class="form-group">
          <label class="form-label">Slug</label>
          <input class="form-control-dash" placeholder="/page-slug">
        </div>
        
        <div class="form-group">
          <label class="form-label">Content</label>
          <textarea class="form-control-dash" rows="10" placeholder="Write page content..."></textarea>
        </div>

        <div class="grid-2">

          <div class="form-group">
            <label class="form-label">Status</label>
            <select class="form-select-dash">
              <option>Draft</option>
              <option>Published</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Template</label>
            <select class="form-select-dash">
              <option>Default</option>
              <option>Full Width</option>
              <option>Sidebar</option>
            </select>
          </div>

        </div>

        <div class="action-buttons">
          <button class="btn-outline-dash">Save Draft</button>
          <button class="btn-primary-dash"><i class="fas fa-check"></i> Publish</button>
        </div>

      </div>

    </main>

  </div>

</div>

<script src="../aside.js"></script>
<script src="../header.js"></script>
<script src="../../assets/js/all.min.js"></script>
<script src="../../assets/js/dashboard.js"></script>
</body>
</html>
