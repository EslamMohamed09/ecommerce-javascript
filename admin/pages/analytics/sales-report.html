<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopVista — Sales Report</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="../../assets/styles/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../assets/styles/all.min.css">
  <link rel="stylesheet" href="../../assets/styles/dashboard.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<div id="preloader" class="preloader">
  <div class="preloader-content">
    <div class="preloader-logo">SV</div>
    <div class="preloader-spinner"></div>
    <div class="preloader-text">Loading ShopVista...</div>
  </div>
</div>
  
<div class="dashboard-wrapper">

  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main Navigation"></aside>

  <div class="main-content">

    <header class="main-header" role="banner"></header>

    <main class="page-content sales-report-page" role="main">

      <div class="page-header">
        <div>
          <h1 class="page-title">Sales Report</h1>
          <p class="page-subtitle">Detailed sales analytics</p>
        </div>
        <div class="breadcrumb">
          <a href="../../index.html">Home</a>
          <span class="sep">/</span>
          <span>Sales Report</span>
        </div>
      </div>

      <div class="stats-grid">

        <div class="stat-card">
          <div class="stat-icon blue"><i class="bi bi-currency-dollar"></i></div>
          <div class="stat-value">$128,450</div>
          <div class="stat-label">Total Sales</div>
        </div>

        <div class="stat-card">
          <div class="stat-icon green"><i class="bi bi-graph-up-arrow"></i></div>
          <div class="stat-value">$4,281</div>
          <div class="stat-label">Avg. Daily Sales</div>
        </div>

        <div class="stat-card">
          <div class="stat-icon orange"><i class="bi bi-file-text-fill"></i></div>
          <div class="stat-value">847</div>
          <div class="stat-label">Transactions</div>
        </div>

        <div class="stat-card">
          <div class="stat-icon cyan"><i class="bi bi-percent"></i></div>
          <div class="stat-value">4.8%</div>
          <div class="stat-label">Conversion Rate</div>
        </div>

      </div>

      <div class="card">
        <h3 class="card-title">Sales Trend</h3>
        <div style="height:300px">
          <canvas id="salesChart"></canvas>
        </div>
      </div>

      <script>
        document.addEventListener('DOMContentLoaded',() => { 
          if(typeof Chart!=='undefined'){new Chart(document.getElementById('salesChart'),
            {type:'bar',data:{labels:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],datasets:[
            {label:'Sales',data:[8500,12300,10800,14400,16200,13900,18600,15100,19400,22200,20800,24600],backgroundColor:'rgba(10,132,255,0.6)',borderRadius:6}]},
            options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
            scales:{x:{grid:{display:false},ticks:{color:'#556677'}},y:{grid:{color:'rgba(255,255,255,0.04)'},
            ticks:{color:'#556677',callback:v=>'$'+v/1000+'k'}}}}})}})
      </script>
      
    </main>

  </div>

</div>

<script src="../aside.js"></script>
<script src="../header.js"></script>
<script src="../../assets/js/all.min.js"></script>
<script src="../../assets/js/dashboard.js"></script>
</body>
</html>
