<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopVista — All Reviews</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="../../assets/styles/all.min.css">
  <link rel="stylesheet" href="../../assets/styles/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../../assets/styles/dashboard.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<div id="preloader" class="preloader">
  <div class="preloader-content">
    <div class="preloader-logo">SV</div>
    <div class="preloader-spinner"></div>
    <div class="preloader-text">Loading ShopVista...</div>
  </div>
</div>
  
<div class="dashboard-wrapper">
    
  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main Navigation"></aside>

  <div class="main-content">

    <header class="main-header" role="banner"></header>

    <main class="page-content all-review-page" role="main">

      <div class="page-header">

        <div>
          <h1 class="page-title">All Reviews</h1>
          <p class="page-subtitle">Manage customer reviews</p>
        </div>

        <div class="breadcrumb">
          <a href="../../index.html">Home</a>
          <span class="sep">/</span>
          <span>All Reviews</span>
        </div>

      </div>

      <div class="tab-nav">
        <button class="tab-btn active">All (328)</button>
        <button class="tab-btn">Pending (5)</button>
        <button class="tab-btn">Approved (310)</button>
        <button class="tab-btn">Rejected (13)</button>
      </div>

      <div class="table-card">
        <table class="data-table">
          <thead>
            <tr>
              <th>Customer</th>
              <th>Product</th>
              <th>Rating</th>
              <th>Review</th>
              <th>Date</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="customer-name-field">Ahmed Salem</td>
              <td>MacBook Pro</td>
              <td class="rating-field">
                <i class="bi bi-star-fill"></i>
                <i class="bi bi-star-fill"></i>
                <i class="bi bi-star-fill"></i>
                <i class="bi bi-star-fill"></i>
                <i class="bi bi-star-fill"></i>
              </td>
              <td class="review-field">Amazing laptop, best I've ever owned!</td>
              <td>Mar 18</td>
              <td><span class="badge badge-success">Approved</span></td>
              <td>
                <button class="btn-icon"><i class="fas fa-eye"></i></button>
                <button class="btn-icon"><i class="fas fa-trash"></i></button>
              </td>
            </tr>
            <tr>
              <td class="customer-name-field">Sara Khalil</td>
              <td>iPhone 15 Pro</td>
              <td class="rating-field">
                <i class="bi bi-star-fill"></i>
                <i class="bi bi-star-fill"></i>
                <i class="bi bi-star-fill"></i>
                <i class="bi bi-star-fill"></i>
                <i class="bi bi-star-half"></i>
              </td>
              <td class="review-field">Great phone but camera could be better</td>
              <td>Mar 17</td>
              <td><span class="badge badge-warning">Pending</span></td>
              <td>
                <button class="btn-icon"><i class="fas fa-check"></i></button>
                <button class="btn-icon"><i class="fas fa-times"></i></button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </main>

  </div>

</div>

<script src="../aside.js"></script>
<script src="../header.js"></script>
<script src="../../assets/js/all.min.js"></script>
<script src="../../assets/js/dashboard.js"></script>
</body>
</html>
