<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopVista — Edit Product</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="../../assets/styles/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../../assets/styles/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../assets/styles/dashboard.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<div id="preloader" class="preloader">
  <div class="preloader-content">
    <div class="preloader-logo">SV</div>
    <div class="preloader-spinner"></div>
    <div class="preloader-text">Loading ShopVista...</div>
  </div>
</div>

<div class="dashboard-wrapper">

  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main Navigation"></aside>

  <div class="main-content">
  
    <header class="main-header" role="banner"></header>

    <main class="page-content edit-product-page" role="main">

      <div class="page-header">
        <div>
          <h1 class="page-title">Edit Product</h1>
          <p class="page-subtitle">Modify product details</p>
        </div>
        <div class="breadcrumb">
          <a href="../../index.html">Home</a>
          <span class="sep">/</span>
          <span>Edit Product</span>
        </div>
      </div>

      <div class="grid-2">

        <div class="card">
          
          <h3 class="card-title">Product Information</h3>

          <div class="form-group">
            <label class="form-label">Product Name</label>
            <input class="form-control-dash" value="MacBook Pro 16&quot;">
          </div>

          <div class="form-group">
            <label class="form-label">Description</label>
            <textarea class="form-control-dash" rows="5">The most powerful MacBook Pro ever with M3 Max chip, up to 128GB unified memory.</textarea>
          </div>

          <div class="grid-2">

            <div class="form-group">
              <label class="form-label">SKU</label>
              <input class="form-control-dash" value="SKU-001">
            </div>
              
            <div class="form-group">
              <label class="form-label">Category</label>
              <select class="form-select-dash">
                <option selected>Electronics</option>
                <option>Fashion</option>
              </select>
            </div>

          </div>
        
        </div>

        <div class="pricing-block">

          <div class="pricing-card card">

            <h3 class="card-title">Pricing</h3>

            <div class="grid-2">

              <div class="form-group">
                <label class="form-label">Price ($)</label>
                <input class="form-control-dash" value="2499.00">
              </div>

              <div class="form-group">
                <label class="form-label">Sale Price ($)</label>
                <input class="form-control-dash" value="2299.00">
              </div>

            </div>

            <div class="form-group">
              <label class="form-label">Stock</label>
              <input class="form-control-dash" value="142">
            </div>

          </div>

          <div class="form-actions">
            <button class="btn-outline-dash">Cancel</button>
            <button class="btn-primary-dash"><i class="fas fa-save"></i> Update Product</button>
          </div>

        </div>

      </div>

    </main>

  </div>

</div>

<script src="../aside.js"></script>
<script src="../header.js"></script>
<script src="../../assets/js/all.min.js"></script>
<script src="../../assets/js/dashboard.js"></script>
</body>
</html>
