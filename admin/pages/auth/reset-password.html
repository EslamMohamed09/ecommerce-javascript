<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopVista — Reset Password</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../../assets/styles/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../assets/styles/all.min.css">
  <link rel="stylesheet" href="../../assets/styles/dashboard.css">
</head>
<body>

<div id="preloader" class="preloader">
  <div class="preloader-content">
    <div class="preloader-logo">SV</div>
    <div class="preloader-spinner"></div>
    <div class="preloader-text">Loading ShopVista...</div>
  </div>
</div>

<div class="auth-wrapper reset-password-page">

  <div class="auth-brand-side">
    <div class="sidebar-logo">SV</div>
    <h1 class="auth-brand-title">New Password</h1>
    <p class="auth-brand-desc">Choose a strong password that you haven't used before. A good password is at least 8 characters with a mix of letters, numbers, and symbols.</p>
  </div>

  <div class="auth-form-side">

    <div class="auth-form-box">

      <div class="secure-reset-icon"><i class="fas fa-lock-open"></i></div>

      <h2 class="auth-form-title">Reset Password</h2>
      <p class="auth-form-subtitle">Create a new password for your account</p>

      <form>

        <div class="auth-input-group"> <!-- password -->
          <i class="fas fa-lock field-icon"></i>
          <input type="password" class="auth-input" placeholder="New password" aria-label="New password" required>
          <button type="button" class="password-toggle" aria-label="Show password"><i class="fas fa-eye"></i></button>
        </div>

        <div class="auth-input-group"> <!-- confirm password -->
          <i class="fas fa-lock field-icon"></i>
          <input type="password" class="auth-input" placeholder="Confirm new password" aria-label="Confirm password" required>
        </div>
        
        <div class="password-strength"> <!-- Password strength -->
          <div class="password-strength-dashes">
            <div class="success-dash"></div>
            <div class="success-dash"></div>
            <div class="warning-dash"></div>
            <div class="empty-dash"></div>
          </div>
          <div class="password-strength-title">Password strength: <span>Medium</span></div>
        </div>

        <button type="submit" class="auth-btn">Reset Password</button>

      </form>

      <p class="auth-footer-text">
        <a href="login.html"><i class="fas fa-arrow-left"></i> Back to Sign In</a>
      </p>

    </div>

  </div>

</div>

<script src="../aside.js"></script>
<script src="../header.js"></script>
<script src="../../assets/js/all.min.js"></script>
<script src="../../assets/js/dashboard.js"></script>
</body>
</html>
